    <link rel="manifest" href="/site.webmanifest">

    <!-- Runs before FCP:  applies the saved/system theme so there is no flash
      Key and JSON format must match src/hooks/useLocalStorage.js (`wg-theme` -> "dark" | "light") 
    -->
    <script>
      (function () {
        var theme;
        try {
          theme = JSON.parse(localStorage.getItem('wg-theme'));
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', theme === 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
